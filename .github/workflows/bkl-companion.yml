name: BKL companion packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["bkl-plugin-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate manifests and configuration/export boundaries
        run: |
          python3 scripts/bkl_packages.py validate
          python3 -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/bkl-plugin-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Package exact-source companion release
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("plugins/banyan-knowledge-lite/plugin.json"))["version"])')"
          [[ "${GITHUB_REF_NAME}" == "bkl-plugin-v${version}" ]]
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published packages.' >&2
            exit 1
          fi
          python3 scripts/bkl_packages.py package --output artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --verify-tag --prerelease \
            --title "BK Lite companion ${version} — Lite beta.2.2" \
            --notes-file docs/bkl-companion-release-0.1.3.md
