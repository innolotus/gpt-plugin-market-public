    retentionPolicy: RESPECT_API_PLAN_AND_DATA_LICENCE
    licenceNotes: >
      Capabilities depend on the enabled API package/data access level.
      Do not treat API access as permission to create an unrestricted permanent replica.
    status: ACTIVE

