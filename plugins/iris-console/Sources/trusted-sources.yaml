sources:
  - sourceId: rea_authorised
    name: realestate.com.au authorised access
    owner: REA Group
    jurisdiction: AU
    authorityLevel: LICENSED_MARKET_SOURCE
    homepage: https://www.realestate.com.au/
    terms: https://about.realestate.com.au/terms-use/
    acquisitionMethods:
      - OFFICIAL_CHATGPT_APP
      - AUTHORISED_INTEGRATION
      - LICENSED_ACCESS
    supportedFactTypes:
      - ACTIVE_LISTING
      - LISTING_STATUS
      - LISTING_GUIDE
      - AUCTION_SCHEDULE
      - INSPECTION_SCHEDULE
      - LISTING_PROPERTY_ATTRIBUTES
      - AGENT_LISTING_CLAIMS
    freshnessPolicy: VERIFY_AT_EXECUTION
    retentionPolicy: DO_NOT_BUILD_REA_DERIVED_PROPERTY_DATABASE
    licenceNotes: >
      Do not scrape, crawl, index or systematically extract REA website content.
      Use only official/authorised capabilities or user-supplied material with appropriate rights.
    status: ACTIVE

  - sourceId: domain
    name: Domain Developer API
    owner: Domain Group
    jurisdiction: AU
    authorityLevel: LICENSED_MARKET_SOURCE
