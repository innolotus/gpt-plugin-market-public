registryVersion: AU-SA-2026.10-v2
jurisdiction: AU-SA

resolutionPolicies:
  PREFER_AUTHORITATIVE:
    description: Prefer the current authoritative/statutory source for this FactType.
  PREFER_FRESHEST_LICENSED:
    description: Prefer the freshest approved market source; preserve conflict when current sources disagree materially.
  COMBINE_MARKET_EVIDENCE:
    description: Combine multiple approved market observations rather than selecting one as truth.
  REQUIRE_FORMAL_DOCUMENT:
    description: Do not infer the fact from secondary web sources when a formal document/search is materially required.
  NO_AUTO_RESOLVE:
    description: Preserve differing estimates/claims and expose the range/conflict.

factTypes:
