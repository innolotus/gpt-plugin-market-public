notes:
  - Mortgage rates are not derived directly from the RBA cash rate.
  - Builder quotes, bank pre-approvals, inspections and agent appraisals are user/client evidence and should be classified separately.
  - Market estimates should generally be shown as evidence/ranges rather than converted into certified valuations.
  - A source being preferred for one FactType does not make it preferred for another.
